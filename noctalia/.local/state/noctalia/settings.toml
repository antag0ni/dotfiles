[shell.panel]
launcher_placement = "attached"

[theme]
builtin = "Catppuccin"
community_palette = "Jiva Paper"
source = "community"

[wallpaper.default]
path = "~/.local/state/noctalia/images/nix-wallpaper-nineish-dark-gray.png"

[wallpaper.last]
path = "~/.local/state/noctalia/images/nix-wallpaper-nineish-dark-gray.png"

[wallpaper.monitors.Virtual-1]
path = "~/.local/state/noctalia/images/nix-wallpaper-nineish-dark-gray.png"

[widget.control-center]
custom_image = "~/.local/state/noctalia/images/nixos.svg"
custom_image_colorize = true
scale = 1.1500000000000001

[widget.launcher]
enabled = false

[widget.spacer_2]
length = 10
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.wallpaper]
enabled = false